spring.application.name=athlete-exchange

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Local dev: Spring Boot starts the services in the root compose file.
spring.docker.compose.file=../compose.yaml

# Dev-only HMAC secret; override ATHLETEX_SECURITY_JWTSECRET outside local dev.
athletex.security.jwt-secret=dev-only-jwt-secret-0123456789abcdef-0123456789abcdef
# Paper-money starting balance for new users ($10,000.00).
athletex.seed-balance-cents=1000000
