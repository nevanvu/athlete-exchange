spring.application.name=athlete-exchange

# Behind a reverse proxy (nginx in compose.prod.yaml), take the client address from X-Forwarded-For
# when the request comes from an internal proxy; otherwise per-address rate limits would see one client.
server.forward-headers-strategy=native

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Local dev: Spring Boot starts the services in the root compose file.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.profiles.active=streaming

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=athlete-exchange
spring.kafka.consumer.auto-offset-reset=earliest
# Game-event ingestion from Kafka and the outbox relay to Kafka.
athletex.kafka.enabled=true
athletex.kafka.game-events-topic=game-events
athletex.kafka.market-events-topic=market-events
athletex.outbox.relay.enabled=true
# Relay latency bounds how quickly prices reach browsers; published rows are purged after an hour.
athletex.outbox.relay.delay-ms=200
athletex.outbox.retention=PT1H
athletex.ingestion.reorder-max-wait-ms=2000
# Fair value: periodic refresh so news sentiment decays between game events.
athletex.fair-value.refresh-ms=60000
# Settlement: grace period after a slate closes, poll interval, and the stat-correction window.
athletex.settlement.delay=PT10S
athletex.settlement.poll-ms=5000
athletex.settlement.correction-window=PT48H
# Trading halts: one event moving fair value by more than the threshold (and by at least the
# minimum amount), or an athlete ruled OUT, halts the market for at least the minimum duration.
athletex.halts.threshold=0.15
athletex.halts.min-move-cents=100
athletex.halts.min-duration=PT30S
athletex.halts.poll-ms=1000
# Market maker: the house quotes both sides around fair value from its own inventory and cash.
athletex.market-maker.enabled=true
athletex.market-maker.quote-ms=2000
athletex.market-maker.quote-size=50
athletex.market-maker.max-long=2000
athletex.market-maker.base-spread=0.02
athletex.market-maker.max-spread=0.05
# Position limit per athlete: shares held + open buys + open IPO bids. The house is exempt; 0 turns it off.
athletex.limits.max-position-shares=250
# Rate limits: order entry per user; sign-in and registration per client address.
athletex.rate-limit.trading.capacity=20
athletex.rate-limit.trading.per-second=10
athletex.rate-limit.sign-in.capacity=10
athletex.rate-limit.sign-in.per-minute=10
# Feed: a trade at least this large (in cents) is a notable move.
athletex.feed.big-trade-cents=100000
# Surveillance: flag two accounts trading one athlete back and forth at least this often
# within the window while little changes hands net.
athletex.surveillance.window=PT24H
athletex.surveillance.round-trip-min-trades=4
athletex.surveillance.round-trip-max-net-share=0.2
athletex.surveillance.scan-ms=60000
# Exchange operators (comma-separated usernames; letters, digits, underscores) who can open the surveillance view.
athletex.admin-usernames=

# Dev-only HMAC secret; override ATHLETEX_SECURITY_JWTSECRET outside local dev.
athletex.security.jwt-secret=dev-only-jwt-secret-0123456789abcdef-0123456789abcdef
# Paper-money starting balance for new users ($10,000.00).
athletex.seed-balance-cents=1000000
# Slate lifecycle scheduler (time-based SCHEDULED->IPO->OPEN_MARKET transitions).
athletex.scheduler.enabled=true
athletex.scheduler.fixed-delay-ms=5000
# Seed a demo slate on startup for local dev.
athletex.demo-seed.enabled=true
