# Test-wide overrides. Tests run with no active profile, so Spring Boot loads this "default"
# profile file on top of application.properties; the running app never sees it.

# Existing scenarios buy entire 1000-share IPOs; position limits have their own tests.
athletex.limits.max-position-shares=0
# Many accounts register from one test client address.
athletex.rate-limit.sign-in.capacity=10000
# An operator account for the admin access tests.
athletex.admin-usernames=ops_admin
