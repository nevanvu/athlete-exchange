# Serves the built frontend and proxies the API and the WebSocket to the exchange, so the
# browser talks to a single origin (no CORS) exactly as it does with the Vite dev server.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://exchange:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://exchange:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/slates/..., /portfolio) all load the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
